<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhilmar — Prévention des blessures aux mains · Mine Éléonore</title>
<style>
  :root{
    --bg:#141210; --bg2:#1B1712; --card:#231E17; --card2:#2C261D; --line:#3C352A;
    --amber:#F2A93C; --gold:#F7C775; --amberd:#C9852A;
    --white:#fff; --txt:#ECE7DD; --mut:#B4AD9F; --mut2:#857E70;
    --danger:#E4572E; --ok:#8FB35A;
    --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:var(--sans)}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#191410,#000)}
  #deck{position:relative;width:1280px;height:720px;transform-origin:center center}
  .slide{position:absolute;inset:0;background:var(--bg);color:var(--txt);opacity:0;visibility:hidden;
    transition:opacity .45s ease;overflow:hidden;padding:44px 46px}
  .slide.active{opacity:1;visibility:visible}
  .slide::after{content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 160px rgba(0,0,0,.55)}
  h1,h2,h3{font-family:var(--serif);font-weight:700;color:var(--white);line-height:1.05}
  .eyebrow{font-size:14px;font-weight:700;letter-spacing:.22em;color:var(--amber);text-transform:uppercase}
  .title{font-size:34px;margin-top:8px}
  .muted{color:var(--mut)} .amber{color:var(--amber)} .gold{color:var(--gold)}
  /* logo */
  .logo{display:flex;align-items:center;gap:10px}
  .logo .mark{width:30px;height:30px;border-radius:7px;background:var(--amber);position:relative;flex:none}
  .logo .mark::before{content:"";position:absolute;left:11px;top:8px;border-style:solid;
    border-width:7px 0 7px 11px;border-color:transparent transparent transparent var(--bg)}
  .logo .word{font-family:var(--serif);font-weight:700;color:#fff;font-size:19px}
  .topbar{position:absolute;top:40px;left:46px;right:46px;display:flex;justify-content:space-between;align-items:center}
  .site{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--mut2)}
  .site b{color:var(--amber)}
  .foot{position:absolute;left:46px;right:46px;bottom:26px;display:flex;justify-content:space-between;
    align-items:center;font-size:11px;color:var(--mut2)}
  .foot .pg{font-family:var(--serif);color:var(--amber);font-size:14px}
  .head{position:absolute;left:46px;top:96px;right:46px}
  .head .title{font-size:33px}
  .body{position:absolute;left:46px;right:46px;top:168px;bottom:60px}
  /* cards / grid */
  .grid{display:grid;gap:14px;height:100%}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  .card.acc{background:var(--card2);border-color:var(--amberd)}
  .chip{width:60px;height:60px;border-radius:50%;background:var(--bg2);border:1.5px solid var(--amber);
    display:flex;align-items:center;justify-content:center;flex:none}
  .chip svg{width:30px;height:30px}
  .chip.dk{border-color:var(--amberd)}
  .stat{font-family:var(--serif);font-weight:700;color:var(--amber);line-height:.95}
  .src{font-size:10px;font-style:italic;color:var(--mut2)}
  /* media */
  .media{position:relative;background:#0C0A08;border:1px solid var(--amberd);border-radius:14px;overflow:hidden}
  .media video,.media img{width:100%;height:100%;object-fit:cover;display:block}
  .media .tag{position:absolute;top:14px;left:14px;background:var(--amber);color:#1a130a;font-weight:700;
    font-size:12px;padding:5px 12px;border-radius:8px;letter-spacing:.04em;z-index:2}
  .media .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 20px 16px;z-index:2;
    background:linear-gradient(to top,rgba(6,5,4,.92),transparent);font-family:var(--serif);
    font-style:italic;font-weight:700;color:var(--gold);font-size:19px;text-align:center}
  .media .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--mut2)}
  .media .ph .play{width:78px;height:78px;border-radius:50%;border:2.5px solid var(--amber);position:relative}
  .media .ph .play::before{content:"";position:absolute;left:31px;top:24px;border-style:solid;
    border-width:15px 0 15px 24px;border-color:transparent transparent transparent var(--amber)}
  ul.checks{list-style:none;display:flex;flex-direction:column;gap:14px}
  ul.checks li{display:flex;gap:14px;align-items:center;font-size:16px}
  .dot{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--ok)}
  .dot svg{width:14px;height:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:var(--amber);color:#1a130a;text-align:left;padding:9px 12px;font-weight:700}
  td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--txt)}
  tr:nth-child(even) td{background:var(--bg2)}
  td.norm{color:var(--amber)}
  /* nav */
  #nav{position:fixed;bottom:16px;right:20px;display:flex;gap:8px;z-index:50}
  #nav button{background:rgba(35,30,23,.9);border:1px solid var(--line);color:var(--amber);
    width:38px;height:38px;border-radius:9px;font-size:17px;cursor:pointer}
  #nav button:hover{border-color:var(--amber)}
  #prog{position:fixed;left:0;top:0;height:3px;background:var(--amber);width:0;z-index:60;transition:width .3s}
  #count{position:fixed;bottom:22px;left:22px;color:var(--mut2);font-size:12px;font-family:var(--sans);z-index:50}
  #hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);color:var(--mut2);font-size:12px;z-index:50;
    opacity:.85;transition:opacity 1s}
</style>
</head>
<body>

<div id="stage"><div id="deck"></div></div>
<div id="count"></div>
<div id="hint">◀ ▶ ou Espace pour naviguer</div>
<div id="nav"><button id="prev">‹</button><button id="btnf">⤢</button><button id="next">›</button></div>

<script>
const BASE="https://d8j0ntlcm91z4.cloudfront.net/user_32OPpzD5zkswcfWaZNfKYmSRTp0/";
const IMG={tunnel:"hf_20260721_062230_c09ab877-c532-4c9d-9229-4b5156325ccd.png",
  pinch:"hf_20260721_062234_18aad963-83fb-4097-8552-f0add9ade79e.png",

  tower:S('<path d="M256 192a48 48 0 00-24 90v182h48V282a48 48 0 00-24-90zM152 88l-34-34a208 208 0 000 404l34-34a160 160 0 010-336zm208 0a160 160 0 010 336l34 34a208 208 0 000-404z"/>'),
  clip:S('<path d="M336 64h48a32 32 0 0132 32v352a32 32 0 01-32 32H128a32 32 0 01-32-32V96a32 32 0 0132-32h48a48 48 0 0196 0zm-80 0a16 16 0 100 32 16 16 0 000-32zm-32 288l-72-72 34-34 38 38 86-86 34 34z"/>'),

};

const slides=[];

/* 1 — Titre */
slides.push(`
<div class="slide" data-vid="tunnel" style="padding:0">
  <div class="media" style="position:absolute;inset:0;border:0;border-radius:0">
    <video muted loop playsinline poster="${img('tunnel')}"><source src="${vid('tunnel')}" type="video/mp4"></video>
    <div class="ph"><div class="play"></div></div>
  </div>
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,8,6,.94) 44%,rgba(10,8,6,.35) 78%,rgba(10,8,6,.15))"></div>
  <div style="position:absolute;left:56px;top:46px" class="logo"><span class="mark"></span><span class="word">Dhilmar</span></div>
  <div class="site" style="position:absolute;left:57px;top:86px">MINE <b>ÉLÉONORE</b></div>
  <div style="position:absolute;left:56px;top:250px;right:420px">
    <div class="eyebrow">Santé · Sécurité au travail</div>
    <h1 style="font-size:60px;margin-top:12px;line-height:1.02">La sécurité<br>entre vos mains</h1>
    <div style="font-size:22px;font-style:italic;color:var(--gold);margin-top:22px">Prévention des blessures aux mains</div>
    <div style="width:110px;height:1px;background:var(--line);margin:26px 0 16px"></div>
    <div class="muted" style="font-size:13px">Rencontre santé-sécurité</div>
    <div style="font-size:15px;font-weight:700;color:var(--txt)">Dhilmar — Mine Éléonore</div>
  </div>
</div>`);

/* 2 — Objectifs */
slides.push(`
<div class="slide">${hdr("Pourquoi cette rencontre","Objectifs de la rencontre")}
  <div class="body"><div class="grid" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr">
    ${obj(1,IC.eye,"Comprendre","Pourquoi nos mains sont autant exposées dans nos opérations.")}
    ${obj(2,IC.target,"Reconnaître","Repérer la « ligne de tir » et les points de pincement.")}
    ${obj(3,IC.glove,"Choisir","Sélectionner et porter le bon gant pour chaque tâche.")}
    ${obj(4,IC.kit,"Réagir","Réagir vite et déclarer — même une simple égratignure.")}
  </div></div>${foot(2)}</div>`);

/* 3 — Vos mains */
slides.push(`
<div class="slide">${hdr("Ce que nous protégeons","Vos mains, votre outil le plus précieux")}
  <div class="body"><div style="display:grid;grid-template-columns:1.15fr 1fr;gap:22px;height:100%">
    <div style="display:flex;flex-direction:column;justify-content:center">
      <h2 style="font-size:34px;color:var(--amber)">Irremplaçables.</h2>
      <p style="font-size:17px;margin-top:14px;line-height:1.5">27 os, des dizaines de muscles, de tendons, de vaisseaux et de nerfs <b>dans un espace minuscule.</b></p>
      <p style="font-size:17px;margin-top:12px;line-height:1.5">Une seule seconde d'inattention peut coûter <span class="gold" style="font-style:italic;font-weight:700">une mobilité — à vie.</span></p>
      <div class="card acc" style="margin-top:18px;display:flex;gap:14px;align-items:center;padding:16px 18px">
        <div class="chip" style="width:44px;height:44px">${IC.warn}</div>
        <div style="font-size:15px"><span class="muted">Contrairement à un outil,</span> <b>vos mains n'ont aucune pièce de rechange.</b></div>
      </div>
    </div>
    <div style="display:grid;grid-template-rows:1fr 1fr;gap:14px">
      <div class="media"><img src="${img('gloves')}" alt=""><div class="ph">${IC.glove}</div></div>
      <div class="card" style="display:flex;gap:16px;align-items:center">
        <div class="chip">${IC.heart}</div>
        <div><div class="stat" style="font-size:40px;color:#fff">1 M+</div>
        <div style="font-size:12.5px;color:var(--mut);margin-top:4px">travailleurs traités à l'urgence chaque année pour une blessure à la main (É.-U.).</div></div>
      </div>
    </div>
  </div></div>
  <div class="src" style="position:absolute;right:46px;bottom:30px">Source : OSHA / BLS.</div>${foot(3)}</div>`);

/* 4 — Chiffres */
slides.push(`
<div class="slide">${hdr("La réalité en chiffres","Les chiffres qui parlent")}
  <div class="body"><div class="grid" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr">
    ${stat("70 %",IC.glove,"des blessures aux mains surviennent sans aucun gant porté.","National Safety Council")}
    ${stat("71 %",IC.shield,"des blessures aux mains sont évitables avec le bon ÉPI.","OSHA")}
    ${stat("15 %",IC.hand,"des lésions indemnisées au Québec touchent poignets, mains et doigts.","CNESST")}
    ${stat("60 %+",IC.bone,"des blessures avec jours perdus : fractures ou amputations.","NIOSH Mining")}
  </div></div>${foot(4)}</div>`);

/* 5 — Dans nos mines */
slides.push(`
<div class="slide">${hdr("Le portrait du secteur minier","Dans nos mines, la réalité")}
  <div class="body"><div style="display:grid;grid-template-columns:1.05fr 1fr;gap:22px;height:100%">
    <div>
      <div style="font-size:13px;font-weight:700;color:var(--mut);margin-bottom:16px">Types de blessures aux mains et doigts (mines)</div>
      ${bar("Lacérations",53)}${bar("Fractures",26)}${bar("Autres",21)}
      <div class="src" style="margin-top:14px">Source : MSHA / NIOSH Mining.</div>
    </div>
    <div style="display:grid;grid-template-rows:auto 1fr;gap:14px">
      <div class="card acc"><div class="stat" style="font-size:30px">13 700 – 16 200 $</div>
        <div style="font-size:13px;margin-top:8px">Coût direct médian d'une blessure à la main avec perte de temps.</div></div>
      <div class="card">
        <div style="display:flex;gap:14px;align-items:center"><div class="chip" style="width:46px;height:46px">${IC.wave}</div>
        <div style="font-family:var(--serif);font-weight:700;color:#fff;font-size:18px">Vibrations main-bras</div></div>
        <div style="font-size:13.5px;margin-top:12px;line-height:1.45"><span class="amber" style="font-weight:700">63 %</span> d'engourdissements et <span class="amber" style="font-weight:700">34,4 %</span> de douleurs articulaires chez les travailleurs affectés (doigts blancs).</div>
        <div class="src" style="margin-top:10px">Source : IRSST.</div>
      </div>
    </div>
  </div></div>${foot(5)}</div>`);

/* 6 — Ligne de tir */
slides.push(`
<div class="slide">${hdr("Le concept clé","La « ligne de tir »")}
  <div class="body"><div style="display:grid;grid-template-columns:1.1fr .9fr;gap:24px;height:100%">
    <div style="display:flex;flex-direction:column;justify-content:center">
      <p style="font-size:19px;line-height:1.5">Toute zone où votre main peut être <span class="amber" style="font-weight:700">happée, écrasée, coupée ou pincée</span> par une énergie — mécanique, hydraulique, électrique ou gravitaire.</p>
      <div class="muted" style="font-size:13px;margin-top:20px">Avant chaque geste, posez-vous la question :</div>
      <div class="card acc" style="margin-top:10px;border-color:var(--amber)">
        <div style="font-family:var(--serif);font-style:italic;font-weight:700;color:var(--gold);font-size:21px">« Si cette pièce bouge, où va ma main ? »</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:20px;font-size:13px;color:var(--mut)">

        <div><span class="amber">▪</span> Charges suspendues</div><div><span class="amber">▪</span> Énergie emmagasinée</div>

    </div>
    <div style="display:flex;align-items:center;justify-content:center">
      <div style="position:relative;width:420px;height:420px">
        <div class="ring" style="width:330px;height:330px;border-color:var(--line);left:45px;top:45px"></div>
        <div class="ring" style="width:250px;height:250px;border-color:var(--amberd);left:85px;top:85px"></div>
        <div class="ring" style="width:170px;height:170px;border-color:var(--amber);border-width:2px;left:125px;top:125px"></div>

        <span class="rl" style="right:8px;top:50%;transform:translateY(-50%)">COUPURE</span>
        <span class="rl" style="left:8px;top:50%;transform:translateY(-50%)">PINCEMENT</span>
      </div>

  </div></div>${foot(6)}</div>`);

/* 7 — Causes */
slides.push(`
<div class="slide">${hdr("D'où viennent les blessures","Les causes principales")}
  <div class="body"><div class="grid" style="grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr">

    ${cause(IC.scissors,"Outils & lames","Couteaux, meuleuses, outils à main mal utilisés.")}
    ${cause(IC.weight,"Manutention & arêtes","Écrasement, tôle, arêtes vives, charges lourdes.")}
    ${cause(IC.bolt,"Énergie non maîtrisée","Absence de cadenassage; énergie résiduelle.")}
    ${cause(IC.wave,"Vibrations","Outils vibrants : foreuse, marteau, meuleuse.")}
    ${cause(IC.glove,"Gant absent / inadéquat","Aucun gant, ou gant non adapté à la tâche.")}
  </div></div>${foot(7)}</div>`);

/* 8 — Vidéo danger */
slides.push(vidSlide(8,"Vidéo — la ligne de tir","Le danger en un instant","pinch",
  "Une main dans la ligne de tir : ça va vite.",
  ["Où sont les mains par rapport aux pièces mobiles ?","Le point de pincement était-il visible ?","Qu'est-ce qui aurait éliminé le risque ?"]));

/* 9 — Hiérarchie */
slides.push(`

// ---- helpers de gabarit ----
function hdr(e,t){return `<div class="topbar"><div class="logo"><span class="mark"></span><span class="word">Dhilmar</span></div><div class="site">MINE <b>ÉLÉONORE</b></div></div>
  <div class="head"><div class="eyebrow">${e}</div><div class="title">${t}</div></div>`;}
function foot(n){return `<div class="foot"><span>Santé-Sécurité · Prévention des blessures aux mains</span><span class="pg">${String(n).padStart(2,"0")}</span></div>`;}
function obj(n,ic,t,d){return `<div class="card" style="display:flex;gap:18px;align-items:flex-start;position:relative">
  <div class="chip">${ic}</div><div><div style="font-family:var(--serif);font-weight:700;color:#fff;font-size:21px">${t}</div>
  <div style="font-size:14px;color:var(--mut);margin-top:8px;line-height:1.4">${d}</div></div>
  <div style="position:absolute;right:20px;top:14px;font-family:var(--serif);font-weight:700;color:var(--line);font-size:30px">${String(n).padStart(2,"0")}</div></div>`;}
function stat(v,ic,d,s){return `<div class="card" style="position:relative">
  <div class="chip dk" style="position:absolute;right:20px;top:20px;width:50px;height:50px">${ic}</div>
  <div class="stat" style="font-size:52px">${v}</div>
  <div style="font-size:14.5px;margin-top:12px;line-height:1.35;max-width:78%">${d}</div>
  <div class="src" style="position:absolute;left:22px;bottom:16px">${s}</div></div>`;}
function cause(ic,t,d){return `<div class="card"><div class="chip">${ic}</div>
  <div style="font-family:var(--serif);font-weight:700;color:#fff;font-size:16px;margin-top:14px">${t}</div>
  <div style="font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.35">${d}</div></div>`;}
function bar(l,v){return `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>${l}</span><span class="amber" style="font-weight:700">${v} %</span></div>
  <div style="height:22px;background:var(--bg2);border-radius:6px;overflow:hidden"><div style="height:100%;width:${v/53*100}%;background:linear-gradient(90deg,var(--amberd),var(--amber));border-radius:6px"></div></div></div>`;}
function lvl(n,t,d,w,last){return `<div style="width:${w}%;min-width:340px;background:${last?'var(--amber)':'var(--card)'};border:1px solid ${last?'var(--amber)':'var(--line)'};border-radius:9px;padding:9px 16px;display:flex;gap:14px;align-items:center">
  <div style="font-family:var(--serif);font-weight:700;font-size:22px;color:${last?'var(--bg)':'var(--amber)'}">${n}</div>
  <div><div style="font-family:var(--serif);font-weight:700;font-size:15px;color:${last?'var(--bg)':'#fff'}">${t}</div>
  <div style="font-size:11px;color:${last?'#3A2A10':'var(--mut)'}">${d}</div></div></div>`;}
function step(n,ic,t,d){return `<div class="card" style="position:relative;display:flex;flex-direction:column">
  <div style="font-family:var(--serif);font-weight:700;color:var(--amber);font-size:40px">${n}</div>
  <div class="chip dk" style="position:absolute;right:16px;top:16px;width:46px;height:46px">${ic}</div>
  <div style="font-family:var(--serif);font-weight:700;color:#fff;font-size:16px;margin-top:8px">${t}</div>
  <div style="font-size:12px;color:var(--mut);margin-top:6px;line-height:1.35">${d}</div></div>`;}
function vidSlide(n,e,t,k,cap,pts){return `
<div class="slide" data-vid="${k}">${hdr(e,t)}
  <div class="body"><div style="display:grid;grid-template-columns:1.7fr 1fr;gap:22px;height:100%">
    <div class="media"><div class="tag">● VIDÉO · 5 s</div>
      <video muted loop playsinline poster="${img(k)}"><source src="${vid(k)}" type="video/mp4"></video>
      <div class="ph"><div class="play"></div></div><div class="cap">${cap}</div></div>
    <div style="display:flex;flex-direction:column;justify-content:center">
      <div class="eyebrow">À observer</div>
      <div style="display:flex;flex-direction:column;gap:16px;margin-top:16px">
        ${pts.map(p=>`<div style="display:flex;gap:12px;align-items:flex-start"><span class="dot" style="border-color:var(--amber);margin-top:2px">${IC.check}</span><span style="font-size:14px">${p}</span></div>`).join("")}
      </div>
      <div class="card" style="margin-top:20px;font-size:11px;color:var(--mut)"><span class="amber">▶</span> Clip Higgsfield intégré — lecture au survol / clic.</div>
    </div>
  </div></div>${foot(n)}</div>`;}

// injecter
document.getElementById("deck").innerHTML=slides.join("");
// styles dynamiques (anneaux/étiquettes)
const st=document.createElement("style");
st.textContent=`.ring{position:absolute;border-radius:50%;border:1.25px solid;}
.rl{position:absolute;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--gold);white-space:nowrap}
.slide .ph svg{width:46px;height:46px;opacity:.5}`;
document.head.appendChild(st);

// ---- navigation ----
const els=[...document.querySelectorAll(".slide")];
let i=0;
function scale(){const s=Math.min(innerWidth/1280,innerHeight/720);document.getElementById("deck").style.transform=`scale(${s})`;}
function show(n){
  i=Math.max(0,Math.min(els.length-1,n));
  els.forEach((s,x)=>{s.classList.toggle("active",x===i);
    const v=s.querySelector("video");if(v){if(x===i){v.play().catch(()=>{});}else{v.pause();}}});
  document.getElementById("prog").style.width=((i+1)/els.length*100)+"%";
  document.getElementById("count").textContent=`${i+1} / ${els.length}`;
}
addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowDown"," ","PageDown"].includes(e.key)){e.preventDefault();show(i+1);}
  else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();show(i-1);}
  else if(e.key==="Home")show(0); else if(e.key==="End")show(els.length-1);
  else if(e.key==="f"||e.key==="F"){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
});
document.getElementById("next").onclick=()=>show(i+1);
document.getElementById("prev").onclick=()=>show(i-1);
document.getElementById("btnf").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();};
addEventListener("resize",scale);
setTimeout(()=>document.getElementById("hint").style.opacity="0",4200);
scale();show(0);
</script>
